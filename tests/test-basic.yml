name: Test basic usage - empty skills directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create empty skills directory
        run: mkdir -p .claude/skills

      - id: action
        uses: .
        with:
          path: '.claude/skills'
          strict: 'false'

      - name: Assert score output is numeric
        env:
          SCORE: ${{ steps.action.outputs.score }}
          TOTAL: ${{ steps.action.outputs.total }}
          ERRORS: ${{ steps.action.outputs.errors }}
          WARNINGS: ${{ steps.action.outputs.warnings }}
        run: |
          echo "score: $SCORE"
          echo "total: $TOTAL"
          echo "errors: $ERRORS"
          echo "warnings: $WARNINGS"

          # Score should be a number (0-100 or 0 for empty)
          if ! echo "$SCORE" | grep -qE '^-?[0-9]+(\.[0-9]+)?$'; then
            echo "FAIL: score '$SCORE' is not numeric"
            exit 1
          fi
          echo "PASS: score is numeric"

          # Total should be a number
          if ! echo "$TOTAL" | grep -qE '^-?[0-9]+$'; then
            echo "FAIL: total '$TOTAL' is not numeric"
            exit 1
          fi
          echo "PASS: total is numeric"

          # Errors should be a number
          if ! echo "$ERRORS" | grep -qE '^-?[0-9]+$'; then
            echo "FAIL: errors '$ERRORS' is not numeric"
            exit 1
          fi
          echo "PASS: errors is numeric"

          # Warnings should be a number
          if ! echo "$WARNINGS" | grep -qE '^-?[0-9]+$'; then
            echo "FAIL: warnings '$WARNINGS' is not numeric"
            exit 1
          fi
          echo "PASS: warnings is numeric"
