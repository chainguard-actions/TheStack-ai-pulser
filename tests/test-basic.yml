name: Test basic usage with valid skill file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create skills directory with a sample SKILL.md
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-skills"
          cat > "$GITHUB_WORKSPACE/test-skills/SKILL.md" << 'EOF'
          # My Skill

          ## Description
          This skill helps with coding tasks.

          ## Usage
          Use this skill when you need help with code.

          ## Examples
          - Example 1: Write a function
          - Example 2: Debug an issue
          EOF

      - id: action
        uses: .
        with:
          path: "${{ github.workspace }}/test-skills"
          strict: 'false'
          version: 'latest'

      - name: Assert score output is set
        env:
          SCORE: ${{ steps.action.outputs.score }}
        run: |
          echo "score: $SCORE"
          if [ -z "$SCORE" ]; then
            echo "FAIL: score output is empty"
            exit 1
          fi
          echo "PASS: score=$SCORE"

      - name: Assert total output is set
        env:
          TOTAL: ${{ steps.action.outputs.total }}
        run: |
          echo "total: $TOTAL"
          if [ -z "$TOTAL" ]; then
            echo "FAIL: total output is empty"
            exit 1
          fi
          echo "PASS: total=$TOTAL"

      - name: Assert errors output is set
        env:
          ERRORS: ${{ steps.action.outputs.errors }}
        run: |
          echo "errors: $ERRORS"
          if [ -z "$ERRORS" ]; then
            echo "FAIL: errors output is empty"
            exit 1
          fi
          echo "PASS: errors=$ERRORS"

      - name: Assert warnings output is set
        env:
          WARNINGS: ${{ steps.action.outputs.warnings }}
        run: |
          echo "warnings: $WARNINGS"
          if [ -z "$WARNINGS" ]; then
            echo "FAIL: warnings output is empty"
            exit 1
          fi
          echo "PASS: warnings=$WARNINGS"
